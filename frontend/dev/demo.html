<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>VirtuHome demo</title>
  <meta name="description" content="Try VirtuHome, a live 3D model of your home for Home Assistant, in your browser." />
  <!-- what a link to the demo shows when it is shared -->
  <meta property="og:title" content="VirtuHome: your home, alive in 3D" />
  <meta property="og:description" content="A two-minute tour of a home in 3D inside Home Assistant: lights, cameras, energy and more. Free in HACS." />
  <meta property="og:image" content="https://virtumaps.github.io/virtuhome/demo/og.jpg" />
  <meta property="og:url" content="https://virtumaps.github.io/virtuhome/demo/?tour" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="theme-color" content="#0c1220" />
  <link rel="icon" href="data:," />
  <style>
    :root { --bar: calc(36px + env(safe-area-inset-bottom, 0px)); }
    html, body { margin: 0; height: 100%; background: #0c1220; }
    #view { position: fixed; top: 0; left: 0; right: 0; bottom: var(--bar); }
    #bar {
      position: fixed; left: 0; right: 0; bottom: 0; height: var(--bar); box-sizing: border-box;
      padding: 0 16px env(safe-area-inset-bottom, 0px); display: flex; align-items: center; justify-content: center; gap: 12px;
      font: 14px/1 Roboto, system-ui, sans-serif; color: #c4cfdf; background: #0c1220; border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    #bar a, #bar button { color: #0c1220; background: #56c7ff; border: 0; border-radius: 999px; padding: 6px 12px; font: inherit; font-weight: 600; text-decoration: none; white-space: nowrap; cursor: pointer; }
    #bar button { color: #eef3fb; background: rgba(255, 255, 255, 0.12); }
    #bar a:focus-visible, #bar button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    #lang-box { position: relative; display: inline-flex; align-items: center; gap: 4px; padding: 5px 9px 5px 7px; border-radius: 999px; color: #eef3fb;
      background: rgba(255, 255, 255, 0.12); font-weight: 600; font-size: 12px; letter-spacing: .04em; cursor: pointer; }
    #lang-box svg { width: 16px; height: 16px; fill: currentColor; }
    #lang-box select { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 16px; }
    #lang-box:focus-within { outline: 2px solid #fff; outline-offset: 2px; }
    @media (max-width: 560px) { #demo-note { display: none; } }
    @media (max-width: 440px) { #bar { gap: 8px; padding-left: 8px; padding-right: 8px; font-size: 13px; } #bar a, #bar button { padding: 6px 10px; } }
    #failed { position: fixed; inset: 0 0 var(--bar); margin: 0; padding: 24px; color: #eef3fb; font: 16px/1.5 system-ui, sans-serif; }
  </style>
</head>
<body>
  <div id="view"></div>
  <p id="failed" hidden></p>
  <noscript><p style="color:#eef3fb;font:16px system-ui;padding:24px">The demo needs JavaScript.</p></noscript>
  <div id="bar">
    <span id="demo-note">This is a demo.</span>
    <button id="tour" type="button">&#9654; <span id="tour-label">Take the tour</span></button>
    <a id="get" href="https://github.com/virtumaps/virtuhome#install-hacs">Get VirtuHome</a>
    <!-- the language: a small badge with the language's code over a menu of them -->
    <label id="lang-box"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.9,17.39C17.64,16.59 16.89,16 16,16H15V13A1,1 0 0,0 14,12H8V10H10A1,1 0 0,0 11,9V7H13A2,2 0 0,0 15,5V4.59C17.93,5.77 20,8.64 20,12C20,14.08 19.2,15.97 17.9,17.39M11,19.93C7.05,19.44 4,16.08 4,12C4,11.38 4.08,10.78 4.21,10.21L9,15V16A2,2 0 0,0 11,18M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2Z"/></svg><span id="lang-code">EN</span><select id="lang" aria-label="Language"></select></label>
  </div>
  <script type="module" src="demo.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>VirtuHome demo</title>
  <meta name="description" content="Try VirtuHome, a live 3D model of your home for Home Assistant, in your browser." />
  <meta name="theme-color" content="#0c1220" />
  <link rel="icon" href="data:," />
  <style>
    :root { --bar: calc(36px + env(safe-area-inset-bottom, 0px)); }
    html, body { margin: 0; height: 100%; background: #0c1220; }
    #view { position: fixed; top: 0; left: 0; right: 0; bottom: var(--bar); }
    #bar {
      position: fixed; left: 0; right: 0; bottom: 0; height: var(--bar); box-sizing: border-box;
      padding: 0 16px env(safe-area-inset-bottom, 0px); display: flex; align-items: center; justify-content: center; gap: 12px;
      font: 14px/1 Roboto, system-ui, sans-serif; color: #c4cfdf; background: #0c1220; border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    #bar a { color: #0c1220; background: #56c7ff; border-radius: 999px; padding: 6px 12px; font-weight: 600; text-decoration: none; white-space: nowrap; }
    #bar a:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    #failed { position: fixed; inset: 0 0 var(--bar); margin: 0; padding: 24px; color: #eef3fb; font: 16px/1.5 system-ui, sans-serif; }
  </style>
</head>
<body>
  <div id="view"></div>
  <p id="failed" hidden></p>
  <noscript><p style="color:#eef3fb;font:16px system-ui;padding:24px">The demo needs JavaScript.</p></noscript>
  <div id="bar">
    <span>This is a demo.</span>
    <a href="https://github.com/virtumaps/virtuhome#install-hacs-custom-repository">Get VirtuHome</a>
  </div>
  <script type="module" src="demo.js"></script>
</body>
</html>

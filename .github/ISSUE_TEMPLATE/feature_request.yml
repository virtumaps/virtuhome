name: Feature request
description: Suggest something VirtuHome should do
labels: ["feature", "proposed"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do that you can't today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How do you picture it working?
  - type: textarea
    id: devices
    attributes:
      label: Devices or integrations involved
      placeholder: "e.g. Tado TRVs, Aqara FP2 presence sensor, Roborock vacuum"

name: Bug report
description: Something in VirtuHome doesn't work as expected
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open VirtuHome in the sidebar\n2. Tap Edit\n3. ..."
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: VirtuHome and Home Assistant versions
      placeholder: "VirtuHome 0.3.1, Home Assistant 2026.9.3"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser or app
      placeholder: "Fire HD 8 (2022), HA Companion app; or Chrome on Windows"
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, browser console errors or diagnostics
      description: Please remove anything private (names, addresses) before posting.

name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: The committed build matches the sources
        run: |
          npm run build
          git diff --stat --exit-code -- ../custom_components/virtuhome/frontend || (echo "Run 'npm run build' in frontend/ and commit the result." && exit 1)

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install cryptography pytest
      - run: pytest -q tests
      - name: Python syntax
        run: python -m compileall -q custom_components/virtuhome

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # PolyForm Shield is not on GitHub's licence list; only the HACS default store needs that
          ignore: brands license

name: Pages
# The site on GitHub Pages, built from each published release (or by hand, from the branch or tag
# picked when running it): the user guide (docs/GUIDE.md, a page per part) at the root, the guide of
# the minor release before it in site/<minor>/ (read from its tag), and the online demo in site/demo/.
# Needs Settings → Pages → Source set to "GitHub Actions".

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# one deployment at a time, and a running one is never cut short
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          # every tag, for the previous release's guide
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # fails if the dev harness's live mode or any Home Assistant URL or token handling is bundled,
      # or if a link in the guide leads nowhere
      - name: Build the site
        run: npm run site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
